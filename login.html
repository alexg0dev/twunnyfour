<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — TwunnyFour</title>
            <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@500,700,800&f[]=satoshi@400,500,600,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="tf-nav">
      <div class="tf-nav__inner">
        <a href="index.html" class="tf-logo">Twunny<span>Four</span></a>
        <nav class="tf-nav__links" aria-label="Primary">
          <a href="index.html" class="tf-nav__link">Home</a>
          <a href="email.html" class="tf-nav__link">Email</a>
          <a href="endpoint.html" class="tf-nav__link">Endpoint</a>
          <a href="pricing.html" class="tf-nav__link">Pricing</a>
        </nav>
                <div class="tf-nav__actions">
          <a href="cart.html" class="tf-nav__cart" aria-label="Cart">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M6 6 5 3H2"/></svg>
            <span data-cart-count class="tf-cart-badge">0</span>
          </a>
        </div>
      </div>
    </header>

    <main class="tf-container tf-mx-auto tf-max-w-sm" style="min-height: 70vh; display: flex; flex-direction: column; justify-content: center; padding: 3rem 0;">
      <div class="tf-card" style="padding: 1.75rem;">
        <h1 class="tf-title-md">Account</h1>
        <p class="tf-body-sm tf-mt-2">Sign in to sync your cart and deploy capabilities across devices.</p>

        <div id="signed-out" class="tf-mt-4">
          <div class="tf-mode-toggle">
            <button type="button" data-mode="signin" class="is-active">Sign in</button>
            <button type="button" data-mode="signup">Sign up</button>
          </div>
          <form id="auth-form" class="tf-flex tf-flex-col tf-gap-2">
            <div class="tf-field">
              <label class="tf-field__label" for="email">Email</label>
              <input id="email" type="email" required class="tf-field__input" />
            </div>
            <div class="tf-field">
              <label class="tf-field__label" for="password">Password</label>
              <input id="password" type="password" required minlength="6" class="tf-field__input" />
            </div>
            <p id="auth-error" class="tf-message tf-message--error tf-hidden"></p>
            <p id="auth-ok" class="tf-message tf-message--success tf-hidden"></p>
            <button id="auth-submit" class="tf-btn tf-btn--primary tf-btn--full tf-mt-2">Sign in</button>
          </form>
        </div>

        <div id="signed-in" class="tf-hidden tf-mt-4">
          <p class="tf-body-sm">Signed in as</p>
          <p data-user-email class="tf-title-sm tf-mt-1"></p>
          <div class="tf-flex tf-flex-col tf-gap-2 tf-mt-3">
            <a href="cart.html" class="tf-btn tf-btn--primary">Open cart</a>
            <button id="signout" class="tf-btn tf-btn--secondary">Sign out</button>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/products.js"></script>
    <script src="js/app.js"></script>
    <script src="js/motion.js"></script>
    <script>
      const params = new URLSearchParams(location.search);
      const next = params.get("next") || "cart.html";
      let mode = "signin";
      const out = document.getElementById("signed-out");
      const inn = document.getElementById("signed-in");
      const err = document.getElementById("auth-error");
      const ok = document.getElementById("auth-ok");
      const submit = document.getElementById("auth-submit");

      function setMode(m) {
        mode = m;
        submit.textContent = m === "signin" ? "Sign in" : "Create account";
        document.querySelectorAll(".tf-mode-toggle button").forEach((b) => {
          const active = b.dataset.mode === m;
          b.classList.toggle("is-active", active);
        });
      }
      document.querySelectorAll(".tf-mode-toggle button").forEach((b) => b.addEventListener("click", () => setMode(b.dataset.mode)));

      async function refresh() {
        const session = await window.TW24.cart.getSession();
        out.classList.toggle("tf-hidden", !!session);
        inn.classList.toggle("tf-hidden", !session);
      }

      document.getElementById("auth-form").onsubmit = async (e) => {
        e.preventDefault();
        err.classList.add("tf-hidden");
        ok.classList.add("tf-hidden");
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        submit.disabled = true;
        try {
          if (mode === "signin") {
            const { error } = await window.TW24.supabase.auth.signInWithPassword({ email, password });
            if (error) throw error;
            location.href = next;
          } else {
            const { data, error } = await window.TW24.supabase.auth.signUp({ email, password });
            if (error) throw error;
            if (data.session) location.href = next;
            else {
              ok.textContent = "Account created. Confirm your email if required, then sign in.";
              ok.classList.remove("tf-hidden");
              setMode("signin");
            }
          }
        } catch (ex) {
          err.textContent = ex.message || "Authentication failed";
          err.classList.remove("tf-hidden");
        } finally {
          submit.disabled = false;
        }
      };

      document.getElementById("signout").onclick = async () => {
        await window.TW24.supabase.auth.signOut();
        await refresh();
      };
      refresh();
    </script>
  </body>
</html>
