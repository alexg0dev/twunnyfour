<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — TwunnyFour</title>
    <meta name="description" content="Sign in to TwunnyFour to sync your cart and manage email and endpoint security." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="tf-auth-page">
    <header class="tf-nav tf-nav--auth">
      <div class="tf-nav__inner">
        <a href="index.html" class="tf-logo">Twunny<span>Four</span></a>
        <nav class="tf-nav__links" aria-label="Primary">
          <a href="index.html" class="tf-nav__link">Home</a>
          <a href="email.html" class="tf-nav__link">Email</a>
          <a href="endpoint.html" class="tf-nav__link">Endpoint</a>
          <a href="pricing.html" class="tf-nav__link">Pricing</a>
        </nav>
        <div class="tf-nav__actions">
          <a href="login.html" class="tf-nav__signin is-active">Sign in</a>
          <a href="cart.html" class="tf-nav__cart" aria-label="Cart">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M6 6 5 3H2"/></svg>
            <span data-cart-count class="tf-cart-badge">0</span>
          </a>
          <button id="mobile-nav" class="tf-nav__menu" aria-label="Menu" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
        </div>
      </div>
    </header>
    <div id="mobile-panel" class="tf-mobile-panel">
      <a href="index.html">Home</a>
      <a href="email.html">Email</a>
      <a href="endpoint.html">Endpoint</a>
      <a href="pricing.html">Pricing</a>
      <a href="login.html" class="is-active">Sign in</a>
    </div>

    <main class="tf-login" aria-label="Sign in">
      <section class="tf-login__form-pane" id="signed-out">
        <div class="tf-login__form-inner">
          <div class="tf-login__avatar" aria-hidden="true">
            <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M8 16V8h8M48 8h8v8M56 48v8h-8M16 56H8v-8" />
              <circle cx="32" cy="26" r="10" />
              <path d="M16 52c4-10 12-14 16-14s12 4 16 14" />
            </svg>
          </div>
          <h1 id="auth-heading" class="tf-login__title">Sign In</h1>

          <form id="auth-form" class="tf-login__form" novalidate>
            <div class="tf-login__field">
              <span class="tf-login__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c2-5 6-7 8-7s6 2 8 7"/></svg>
              </span>
              <label class="tf-sr-only" for="email">Email</label>
              <input id="email" type="email" required autocomplete="email" class="tf-login__input" placeholder="Email" />
            </div>
            <div class="tf-login__field">
              <span class="tf-login__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
              </span>
              <label class="tf-sr-only" for="password">Password</label>
              <input id="password" type="password" required minlength="6" autocomplete="current-password" class="tf-login__input" placeholder="Password" />
            </div>

            <p id="auth-error" class="tf-message tf-message--error tf-hidden" role="alert"></p>
            <p id="auth-ok" class="tf-message tf-message--success tf-hidden" role="status"></p>

            <button id="auth-submit" type="submit" class="tf-login__submit">
              <span class="tf-btn__label">Sign In</span>
              <span class="tf-btn__spin" aria-hidden="true"></span>
            </button>

            <div class="tf-login__meta">
              <label class="tf-login__remember">
                <input type="checkbox" id="remember" />
                <span>Remember me</span>
              </label>
              <button type="button" id="forgot" class="tf-login__forgot">Forgot password</button>
            </div>
          </form>
        </div>
      </section>

      <section class="tf-login__welcome" aria-hidden="false">
        <div class="tf-login__welcome-bg" aria-hidden="true"></div>
        <div class="tf-login__welcome-copy">
          <h2 id="welcome-title" class="tf-login__welcome-title">Welcome</h2>
          <p id="welcome-body" class="tf-login__welcome-body">
            Sync your cart and deploy email &amp; endpoint protection across your organization.
          </p>
          <p class="tf-login__switch">
            <span id="switch-text">don't have an account?</span>
            <button type="button" id="mode-switch">Sign up</button>
          </p>
        </div>
      </section>

      <section id="signed-in" class="tf-login__signed tf-hidden">
        <div class="tf-login__signed-inner">
          <p class="tf-caption tf-caption--red">Signed in</p>
          <h2 class="tf-login__title">You're in</h2>
          <p class="tf-login__welcome-body">Signed in as</p>
          <p data-user-email class="tf-auth__email"></p>
          <div class="tf-auth__actions">
            <a href="cart.html" class="tf-btn tf-btn--primary tf-btn--full">Open cart</a>
            <button id="signout" type="button" class="tf-btn tf-btn--secondary tf-btn--full">Sign out</button>
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/products.js"></script>
    <script src="js/app.js"></script>
    <script src="js/motion.js"></script>
    <script>
      const params = new URLSearchParams(location.search);
      const next = params.get("next") || "cart.html";
      let mode = "signin";
      const out = document.getElementById("signed-out");
      const inn = document.getElementById("signed-in");
      const welcome = document.querySelector(".tf-login__welcome");
      const err = document.getElementById("auth-error");
      const ok = document.getElementById("auth-ok");
      const submit = document.getElementById("auth-submit");
      const heading = document.getElementById("auth-heading");
      const pass = document.getElementById("password");
      const welcomeTitle = document.getElementById("welcome-title");
      const welcomeBody = document.getElementById("welcome-body");
      const switchText = document.getElementById("switch-text");
      const modeSwitch = document.getElementById("mode-switch");

      function setMode(m) {
        mode = m;
        const signin = m === "signin";
        document.body.classList.toggle("is-signup", !signin);
        submit.querySelector(".tf-btn__label").textContent = signin ? "Sign In" : "Sign Up";
        heading.textContent = signin ? "Sign In" : "Create Account";
        pass.setAttribute("autocomplete", signin ? "current-password" : "new-password");
        welcomeTitle.textContent = "Welcome";
        welcomeBody.textContent = signin
          ? "Sync your cart and deploy email & endpoint protection across your organization."
          : "Create an account to save deployments and manage security from any device.";
        switchText.textContent = signin ? "don't have an account?" : "already have an account?";
        modeSwitch.textContent = signin ? "Sign up" : "Sign in";
        err.classList.add("tf-hidden");
        ok.classList.add("tf-hidden");
      }

      modeSwitch.addEventListener("click", () => setMode(mode === "signin" ? "signup" : "signin"));

      document.getElementById("forgot").addEventListener("click", () => {
        ok.textContent = "Password reset is available from your email provider or support chat.";
        ok.classList.remove("tf-hidden");
      });

      async function refresh() {
        const session = await window.TW24.cart.getSession();
        const signed = !!session;
        out.classList.toggle("tf-hidden", signed);
        welcome.classList.toggle("tf-hidden", signed);
        inn.classList.toggle("tf-hidden", !signed);
        document.body.classList.toggle("is-authed", signed);
        if (session?.user?.email) {
          document.querySelectorAll("[data-user-email]").forEach((el) => {
            el.textContent = session.user.email;
          });
        }
      }

      document.getElementById("auth-form").onsubmit = async (e) => {
        e.preventDefault();
        err.classList.add("tf-hidden");
        ok.classList.add("tf-hidden");
        const email = document.getElementById("email").value.trim();
        const password = pass.value;
        submit.disabled = true;
        submit.classList.add("is-loading");
        try {
          if (mode === "signin") {
            const { error } = await window.TW24.supabase.auth.signInWithPassword({ email, password });
            if (error) throw error;
            location.href = next;
          } else {
            const { data, error } = await window.TW24.supabase.auth.signUp({ email, password });
            if (error) throw error;
            if (data.session) location.href = next;
            else {
              ok.textContent = "Account created. Confirm your email if required, then sign in.";
              ok.classList.remove("tf-hidden");
              setMode("signin");
            }
          }
        } catch (ex) {
          err.textContent = ex.message || "Authentication failed";
          err.classList.remove("tf-hidden");
        } finally {
          submit.disabled = false;
          submit.classList.remove("is-loading");
        }
      };

      document.getElementById("signout").onclick = async () => {
        await window.TW24.supabase.auth.signOut();
        await refresh();
      };
      refresh();
    </script>
  </body>
</html>
