<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart — TwunnyFour</title>
            <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@500,700,800&f[]=satoshi@400,500,600,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="tf-nav">
      <div class="tf-nav__inner">
        <a href="index.html" class="tf-logo">Twunny<span>Four</span></a>
        <nav class="tf-nav__links" aria-label="Primary">
          <a href="index.html" class="tf-nav__link">Home</a>
          <a href="email.html" class="tf-nav__link">Email</a>
          <a href="endpoint.html" class="tf-nav__link">Endpoint</a>
          <a href="pricing.html" class="tf-nav__link">Pricing</a>
        </nav>
                <div class="tf-nav__actions">
          <a href="login.html" data-auth-link class="tf-nav__text">Sign in</a>
          <a href="pricing.html" class="tf-nav__cta">Get started</a>
          <a href="cart.html" class="tf-nav__cart" aria-label="Cart">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M6 6 5 3H2"/></svg>
            <span data-cart-count class="tf-cart-badge">0</span>
          </a>
          <button id="mobile-nav" class="tf-nav__menu" aria-label="Menu" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
        </div>
      </div>
    </header>
    <div id="mobile-panel" class="tf-mobile-panel">
      <a href="index.html">Home</a>
      <a href="email.html">Email</a>
      <a href="endpoint.html">Endpoint</a>
      <a href="pricing.html">Pricing</a>
    </div>

    <main class="tf-container tf-mx-auto tf-max-w-md" style="padding: clamp(3rem, 8vw, 5rem) 0;">
      <h1 class="tf-title-lg">Your cart</h1>
      <p class="tf-body-sm tf-mt-2">Deployments sync to your TwunnyFour account after login.</p>

      <div id="gate" class="tf-hidden tf-card tf-text-center" style="margin-top: 2rem; padding: 2rem;">
        <p class="tf-title-md">Login required</p>
        <p class="tf-body-sm tf-mt-2">Sign in to view and manage your cart.</p>
        <a id="login-next" href="login.html" class="tf-btn tf-btn--primary tf-mt-3">Sign in</a>
      </div>

      <div id="cart-wrap" class="tf-hidden tf-mt-5">
        <div id="cart-list" class="tf-flex tf-flex-col tf-gap-2"></div>
        <div class="tf-cart-total tf-mt-4">
          <div>
            <p class="tf-caption">Estimated monthly</p>
            <p class="tf-title-lg tf-mt-1">$<span id="cart-total">0</span></p>
          </div>
          <div class="tf-flex tf-flex-wrap tf-gap-2">
            <button id="clear-cart" class="tf-btn tf-btn--secondary">Clear</button>
            <button id="checkout" class="tf-btn tf-btn--primary">Request deployment</button>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/products.js"></script>
    <script src="js/app.js"></script>
    <script src="js/motion.js"></script>
    <script>
      const gate = document.getElementById("gate");
      const wrap = document.getElementById("cart-wrap");
      const list = document.getElementById("cart-list");
      document.getElementById("login-next").href = "login.html?next=" + encodeURIComponent("cart.html");
      document.getElementById("mobile-nav").onclick = () =>
        document.getElementById("mobile-panel").classList.toggle("is-open");

      async function render() {
        const session = await window.TW24.cart.getSession();
        if (!session) {
          gate.classList.remove("tf-hidden");
          wrap.classList.add("tf-hidden");
          return;
        }
        gate.classList.add("tf-hidden");
        wrap.classList.remove("tf-hidden");
        const items = await window.TW24.cart.getCart();
        if (!items.length) {
          list.innerHTML = `<div class="tf-cart-empty">Cart is empty. Explore <a href="email.html">Email</a>, <a href="endpoint.html">Endpoint</a>, or <a href="index.html#capabilities">capabilities</a>.</div>`;
          document.getElementById("cart-total").textContent = "0";
          return;
        }
        let total = 0;
        list.innerHTML = items
          .map((item) => {
            const line = Number(item.price) * item.quantity;
            total += line;
            return `
            <article class="tf-cart-item">
              <div>
                <p class="tf-cart-item__category">${item.product_category || "Item"}</p>
                <h2 class="tf-title-sm tf-mt-1">${item.product_name}</h2>
                <p class="tf-body-sm tf-mt-1">$${item.price} / mo each</p>
              </div>
              <div class="tf-flex tf-items-center tf-gap-2 tf-shrink-0">
                <div class="tf-qty">
                  <button data-dec="${item.id}">−</button>
                  <span>${item.quantity}</span>
                  <button data-inc="${item.id}">+</button>
                </div>
                <p class="tf-cart-item__price">$${line.toFixed(0)}</p>
                <button data-remove="${item.id}" class="tf-btn tf-btn--ghost" style="font-size: 0.75rem;">Remove</button>
              </div>
            </article>`;
          })
          .join("");
        document.getElementById("cart-total").textContent = total.toFixed(0);
      }

      list.addEventListener("click", async (e) => {
        const inc = e.target.closest("[data-inc]");
        const dec = e.target.closest("[data-dec]");
        const rem = e.target.closest("[data-remove]");
        if (!(inc || dec || rem)) return;
        const items = await window.TW24.cart.getCart();
        if (inc) {
          const row = items.find((i) => i.id === inc.dataset.inc);
          if (row) await window.TW24.cart.updateQty(row.id, row.quantity + 1);
        }
        if (dec) {
          const row = items.find((i) => i.id === dec.dataset.dec);
          if (row) await window.TW24.cart.updateQty(row.id, row.quantity - 1);
        }
        if (rem) await window.TW24.cart.removeItem(rem.dataset.remove);
        await render();
      });

      document.getElementById("clear-cart").onclick = async () => {
        await window.TW24.cart.clearCart();
        await render();
      };
      document.getElementById("checkout").onclick = () =>
        window.TW24.cart.toast("Deployment request queued — a specialist will follow up.");
      render();
    </script>
  </body>
</html>
