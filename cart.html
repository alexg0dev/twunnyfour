<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart — TwunnyFour</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { ink: "#0a0b10", signal: "#e60000", mute: "#9aa0ae" },
            fontFamily: { display: ["Syne", "sans-serif"], sans: ["Manrope", "sans-serif"] },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="bg-ink text-white antialiased">
    <div class="noise" aria-hidden="true"></div>

    <header class="nav-blur sticky top-0 z-40">
      <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-5 py-4">
        <a href="index.html" class="font-display text-xl tracking-tight">Twunny<span class="text-signal">Four</span></a>
        <nav class="hidden items-center gap-8 text-sm font-medium text-white/70 md:flex">
          <a href="index.html" class="hover:text-white transition">Home</a>
          <a href="bundles.html" class="hover:text-white transition">Bundles</a>
          <a href="pricing.html" class="hover:text-white transition">Pricing</a>
        </nav>
        <div class="flex items-center gap-2">
          <a href="login.html" data-auth-link class="grid h-10 w-10 place-items-center rounded-full border border-white/10" aria-label="Login">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="8" r="4"/></svg>
          </a>
          <a href="cart.html" class="relative grid h-10 w-10 place-items-center rounded-full border border-signal/60" aria-label="Cart">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M6 6 5 3H2"/></svg>
            <span data-cart-count class="absolute -right-1 -top-1 grid h-5 min-w-5 place-items-center rounded-full bg-signal px-1 text-[10px] font-bold opacity-0">0</span>
          </a>
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-4xl px-5 py-14 md:py-20">
      <h1 class="font-display text-4xl font-extrabold">Your Cart</h1>
      <p class="mt-2 text-sm text-mute">Deployments sync to your TwunnyFour account.</p>

      <div id="gate" class="mt-10 hidden card-line rounded-2xl p-8 text-center">
        <p class="font-display text-2xl font-bold">Login required</p>
        <p class="mt-2 text-sm text-mute">Sign in to view and manage your cart.</p>
        <a id="login-next" href="login.html" class="btn-red mt-6 inline-flex rounded-lg px-5 py-3 text-sm">Sign in</a>
      </div>

      <div id="cart-wrap" class="mt-10 hidden">
        <div id="cart-list" class="space-y-3"></div>
        <div class="mt-8 flex flex-col gap-4 rounded-2xl border border-white/10 p-6 sm:flex-row sm:items-center sm:justify-between">
          <div>
            <p class="text-xs uppercase tracking-[0.2em] text-mute">Estimated monthly</p>
            <p class="font-display text-4xl font-bold">$<span id="cart-total">0</span></p>
          </div>
          <div class="flex flex-wrap gap-3">
            <button id="clear-cart" class="btn-ghost rounded-lg px-4 py-3 text-sm">Clear</button>
            <button id="checkout" class="btn-red rounded-lg px-5 py-3 text-sm">Request deployment</button>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/products.js"></script>
    <script src="js/app.js"></script>
    <script>
      const gate = document.getElementById("gate");
      const wrap = document.getElementById("cart-wrap");
      const list = document.getElementById("cart-list");
      document.getElementById("login-next").href =
        "login.html?next=" + encodeURIComponent("cart.html");

      async function render() {
        const session = await window.TW24.cart.getSession();
        if (!session) {
          gate.classList.remove("hidden");
          wrap.classList.add("hidden");
          return;
        }
        gate.classList.add("hidden");
        wrap.classList.remove("hidden");
        const items = await window.TW24.cart.getCart();
        if (!items.length) {
          list.innerHTML = `<div class="rounded-2xl border border-dashed border-white/15 p-10 text-center text-sm text-mute">Cart is empty. <a class="text-signal underline" href="bundles.html">Browse bundles</a> or <a class="text-signal underline" href="index.html#dashboard">pick capabilities</a>.</div>`;
          document.getElementById("cart-total").textContent = "0";
          return;
        }
        let total = 0;
        list.innerHTML = items
          .map((item) => {
            const line = Number(item.price) * item.quantity;
            total += line;
            return `
            <article class="card-line flex flex-col gap-4 rounded-xl p-4 sm:flex-row sm:items-center sm:justify-between">
              <div>
                <p class="text-[11px] uppercase tracking-[0.16em] text-white/40">${item.product_category || "Item"}</p>
                <h2 class="mt-1 font-display text-lg font-bold">${item.product_name}</h2>
                <p class="mt-1 text-sm text-mute">$${item.price} / mo each</p>
              </div>
              <div class="flex items-center gap-3">
                <div class="flex items-center rounded-lg border border-white/10">
                  <button data-dec="${item.id}" class="px-3 py-2 text-sm">−</button>
                  <span class="min-w-8 text-center text-sm">${item.quantity}</span>
                  <button data-inc="${item.id}" class="px-3 py-2 text-sm">+</button>
                </div>
                <p class="w-20 text-right font-semibold">$${line.toFixed(0)}</p>
                <button data-remove="${item.id}" class="text-xs text-white/45 hover:text-signal">Remove</button>
              </div>
            </article>`;
          })
          .join("");
        document.getElementById("cart-total").textContent = total.toFixed(0);
      }

      list.addEventListener("click", async (e) => {
        const inc = e.target.closest("[data-inc]");
        const dec = e.target.closest("[data-dec]");
        const rem = e.target.closest("[data-remove]");
        if (inc || dec || rem) {
          const items = await window.TW24.cart.getCart();
          if (inc) {
            const row = items.find((i) => i.id === inc.dataset.inc);
            if (row) await window.TW24.cart.updateQty(row.id, row.quantity + 1);
          }
          if (dec) {
            const row = items.find((i) => i.id === dec.dataset.dec);
            if (row) await window.TW24.cart.updateQty(row.id, row.quantity - 1);
          }
          if (rem) await window.TW24.cart.removeItem(rem.dataset.remove);
          await render();
        }
      });

      document.getElementById("clear-cart").onclick = async () => {
        await window.TW24.cart.clearCart();
        await render();
      };

      document.getElementById("checkout").onclick = () => {
        window.TW24.cart.toast("Deployment request queued — a specialist will follow up.");
      };

      render();
    </script>
  </body>
</html>
