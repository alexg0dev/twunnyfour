<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart — TwunnyFour</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { ink: "#0a0b10", accent: "#e60000", mute: "#8b91a3" },
            fontFamily: {
              display: ['"Satoshi"', "system-ui", "sans-serif"],
              sans: ['"Satoshi"', "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="bg-ink text-white font-sans">
    <header class="site-nav">
      <div class="nav-inner">
        <a href="index.html" class="logo">Twunny<em>Four</em></a>
        <nav class="nav-links" aria-label="Primary">
          <a href="index.html" class="nav-link">Home</a>
          <a href="email.html" class="nav-link">Email</a>
          <a href="endpoint.html" class="nav-link">Endpoint</a>
          <a href="pricing.html" class="nav-link">Pricing</a>
        </nav>
        <div class="nav-actions">
          <a href="login.html" data-auth-link class="icon-btn" aria-label="Login">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="8" r="4"/></svg>
          </a>
          <a href="cart.html" class="icon-btn relative" aria-label="Cart" style="border-color: rgba(230,0,0,.45)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M6 6 5 3H2"/></svg>
            <span data-cart-count class="absolute -right-1 -top-1 grid h-5 min-w-5 place-items-center rounded-full bg-accent px-1 text-[10px] font-semibold opacity-0">0</span>
          </a>
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-3xl px-5 py-14 md:py-20">
      <h1 class="font-display text-4xl m-0">Your cart</h1>
      <p class="mt-2 text-sm text-mute">Deployments sync to your TwunnyFour account after login.</p>

      <div id="gate" class="mt-10 hidden tile !p-8 text-center">
        <p class="font-display text-3xl m-0">Login required</p>
        <p class="mt-2 text-sm text-mute">Sign in to view and manage your cart.</p>
        <a id="login-next" href="login.html" class="btn btn-primary mt-6">Sign in</a>
      </div>

      <div id="cart-wrap" class="mt-10 hidden">
        <div id="cart-list" class="space-y-3"></div>
        <div class="mt-8 flex flex-col gap-4 rounded-2xl border border-white/[0.08] bg-[#0e1016] p-6 sm:flex-row sm:items-center sm:justify-between">
          <div>
            <p class="text-xs text-mute">Estimated monthly</p>
            <p class="font-display text-4xl m-0">$<span id="cart-total">0</span></p>
          </div>
          <div class="flex flex-wrap gap-3">
            <button id="clear-cart" class="btn btn-secondary">Clear</button>
            <button id="checkout" class="btn btn-primary">Request deployment</button>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/products.js"></script>
    <script src="js/app.js"></script>
    <script src="js/motion.js"></script>
    <script>
      const gate = document.getElementById("gate");
      const wrap = document.getElementById("cart-wrap");
      const list = document.getElementById("cart-list");
      document.getElementById("login-next").href = "login.html?next=" + encodeURIComponent("cart.html");

      async function render() {
        const session = await window.TW24.cart.getSession();
        if (!session) {
          gate.classList.remove("hidden");
          wrap.classList.add("hidden");
          return;
        }
        gate.classList.add("hidden");
        wrap.classList.remove("hidden");
        const items = await window.TW24.cart.getCart();
        if (!items.length) {
          list.innerHTML = `<div class="rounded-2xl border border-dashed border-white/15 p-10 text-center text-sm text-mute">Cart is empty. <a class="text-accent underline" href="email.html">Email</a>, <a class="text-accent underline" href="endpoint.html">Endpoint</a>, or <a class="text-accent underline" href="index.html#capabilities">capabilities</a>.</div>`;
          document.getElementById("cart-total").textContent = "0";
          return;
        }
        let total = 0;
        list.innerHTML = items
          .map((item) => {
            const line = Number(item.price) * item.quantity;
            total += line;
            return `
            <article class="tile !p-4 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
              <div>
                <p class="text-[11px] text-white/40">${item.product_category || "Item"}</p>
                <h2 class="mt-1 font-display text-2xl m-0">${item.product_name}</h2>
                <p class="mt-1 text-sm text-mute">$${item.price} / mo each</p>
              </div>
              <div class="flex items-center gap-3">
                <div class="flex items-center rounded-lg border border-white/10">
                  <button data-dec="${item.id}" class="px-3 py-2 text-sm">−</button>
                  <span class="min-w-8 text-center text-sm">${item.quantity}</span>
                  <button data-inc="${item.id}" class="px-3 py-2 text-sm">+</button>
                </div>
                <p class="w-20 text-right font-semibold">$${line.toFixed(0)}</p>
                <button data-remove="${item.id}" class="text-xs text-white/45 hover:text-accent">Remove</button>
              </div>
            </article>`;
          })
          .join("");
        document.getElementById("cart-total").textContent = total.toFixed(0);
      }

      list.addEventListener("click", async (e) => {
        const inc = e.target.closest("[data-inc]");
        const dec = e.target.closest("[data-dec]");
        const rem = e.target.closest("[data-remove]");
        if (!(inc || dec || rem)) return;
        const items = await window.TW24.cart.getCart();
        if (inc) {
          const row = items.find((i) => i.id === inc.dataset.inc);
          if (row) await window.TW24.cart.updateQty(row.id, row.quantity + 1);
        }
        if (dec) {
          const row = items.find((i) => i.id === dec.dataset.dec);
          if (row) await window.TW24.cart.updateQty(row.id, row.quantity - 1);
        }
        if (rem) await window.TW24.cart.removeItem(rem.dataset.remove);
        await render();
      });

      document.getElementById("clear-cart").onclick = async () => {
        await window.TW24.cart.clearCart();
        await render();
      };
      document.getElementById("checkout").onclick = () =>
        window.TW24.cart.toast("Deployment request queued — a specialist will follow up.");
      render();
    </script>
  </body>
</html>
